<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 | Telegram Media Downloader</title>
  <link href="{{ url_for('static', filename='login/css/index.css') }}" rel="stylesheet">
</head>

<body class="login-page">
  <div class="login-shell">
    <section class="login-card">
      <div class="login-card__brand">
        <img src="{{ url_for('static', filename='login/images/login.svg') }}" alt="Telegram Media Downloader logo">
        <div>
          <h1>下载管理</h1>
          <p>Telegram Media Downloader</p>
        </div>
      </div>
      <div class="login-intro">
        <h2>登录</h2>
        <p>输入管理员密码，进入下载管理页面。</p>
      </div>
      <div class="login-field">
        <label for="password">密码</label>
        <div class="password-row">
          <input type="password" class="input-p" placeholder="请输入密码" id="password"
            autocomplete="current-password">
          <button type="button" class="password-toggle" id="togglePassword" aria-controls="password" aria-pressed="false">显示</button>
        </div>
      </div>

      <button class="confirm-btn" id="login_button" type="button" onclick="login()">登录</button>
      <p class="login-footer-note">按 Enter 键登录</p>
    </section>
  </div>

  <script src="{{ url_for('static', filename='layui/layui.js') }}"></script>
  <script src="{{ url_for('static', filename='aes/crypto-js-master/crypto-js.js') }}"></script>
  <script src="{{ url_for('static', filename='request/index.js') }}"></script>
  <script>
    const $ = layui.$;
    const layer = layui.layer;
    const passwordInput = $('#password');
    const loginButton = $('#login_button');
    const togglePasswordButton = $('#togglePassword');
    let isSubmitting = false;

    const encrypt = (word) => {
      const key = CryptoJS.enc.Utf8.parse('1234123412ABCDEF');
      const iv = CryptoJS.enc.Utf8.parse('ABCDEF1234123412');
      const srcs = CryptoJS.enc.Utf8.parse(word);
      const encrypted = CryptoJS.AES.encrypt(srcs, key, {
        iv: iv,
        mode: CryptoJS.mode.CBC,
        padding: CryptoJS.pad.Pkcs7
      });
      const hexStr = encrypted.ciphertext.toString();
      return CryptoJS.enc.Base64.stringify(CryptoJS.enc.Hex.parse(hexStr));
    };

    const setSubmitting = (submitting) => {
      isSubmitting = submitting;
      loginButton.prop('disabled', submitting);
      loginButton.text(submitting ? '正在登录…' : '登录');
    };

    const login = () => {
      if (isSubmitting) {
        return;
      }

      const pValue = passwordInput.val();

      if (!pValue) {
        layer.msg('请输入密码');
        passwordInput.trigger('focus');
        return;
      }

      setSubmitting(true);
      request('login', 'post', { password: encrypt(pValue) })
        .then((res) => {
          const code = String(res.code);
          if (code === '1') {
            window.location.href = window.location.origin + '/';
          } else {
            layer.msg('密码错误，请重试');
            passwordInput.val('');
            passwordInput.trigger('focus');
          }
        })
        .catch(() => {
          layer.msg('登录请求失败，请重试');
        })
        .finally(() => {
          setSubmitting(false);
        });
    };

    passwordInput.on('keydown', function (event) {
      if (event.key === 'Enter') {
        login();
      }
    });

    togglePasswordButton.on('click', function () {
      const isHidden = passwordInput.attr('type') === 'password';
      passwordInput.attr('type', isHidden ? 'text' : 'password');
      togglePasswordButton.text(isHidden ? '隐藏' : '显示');
      togglePasswordButton.attr('aria-pressed', isHidden ? 'true' : 'false');
      passwordInput.trigger('focus');
    });

    passwordInput.trigger('focus');
  </script>
</body>

</html>
