<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Telegram Media Downloader</title>
  <link href="static/layui/css/layui.css" rel="stylesheet">
  <link href="static/css/index.css" rel="stylesheet">
  <style>
    body {
      padding: 6px 16px;
    }
  </style>
</head>

<body>
  <div class="layui-tab" lay-filter="telegram_media_downloader">
    <div class="header-title layui-tab-brief">
      <ul class="layui-tab-title">
        <li class="layui-this">Downloading</li>
        <li>Downloaded</li>
        <li>Chats</li>
      </ul>
      <div class="stop-btn" id="download_state" data-value="{{ download_state }}" onclick="download_state_change(this)"> {{ download_state }} </div>
    </div>
    <div class="layui-tab-content" style="padding: 0;">
      <div class="layui-tab-item layui-show">
        <table class="layui-hide" id="download_list" lay-filter="download_list"></table>
      </div>
      <div class="layui-tab-item">
        <table class="layui-hide" id="already_download_list" lay-filter="already_download_list"></table>
      </div>
      <div class="layui-tab-item">
        <form class="layui-form chat-config-form" lay-filter="chat_config_form">
          <input type="hidden" name="origin_chat_id" id="origin_chat_id">
          <div class="layui-row layui-col-space8">
            <div class="layui-col-md2 layui-col-sm6">
              <input type="text" name="chat_id" required lay-verify="required" placeholder="chat id" autocomplete="off" class="layui-input">
            </div>
            <div class="layui-col-md2 layui-col-sm6">
              <input type="number" name="last_read_message_id" placeholder="last message id" autocomplete="off" class="layui-input">
            </div>
            <div class="layui-col-md2 layui-col-sm6">
              <input type="text" name="file_size_min" placeholder="min file size" autocomplete="off" class="layui-input">
            </div>
            <div class="layui-col-md2 layui-col-sm6">
              <input type="text" name="file_size_max" placeholder="max file size" autocomplete="off" class="layui-input">
            </div>
            <div class="layui-col-md2 layui-col-sm8">
              <input type="text" name="download_filter" placeholder="download filter" autocomplete="off" class="layui-input">
            </div>
            <div class="layui-col-md2 layui-col-sm4 chat-config-actions">
              <button class="layui-btn layui-btn-sm" lay-submit lay-filter="save_chat_config">Save</button>
              <button type="button" class="layui-btn layui-btn-primary layui-btn-sm" id="reset_chat_config">New</button>
            </div>
          </div>
        </form>
        <table class="layui-hide" id="chat_config_list" lay-filter="chat_config_list"></table>
      </div>
    </div>
  </div>

  <div class="layui-footer">
    <div class="layui-row layui-col-space1">
      <div class="layui-col-md2">
        <p>Telegram Media Downloader V <b id="app_version" style="color: #009688;">undefined</b>
      </div>
      <div class="layui-col-md7">
      </div>
      <div class="layui-col-md3">
        <div style="padding: 5px; float: right;">
          <!-- <i class="layui-icon layui-icon-upload-circle" style="font-size: 16px; color: #1E9FFF; font-weight: 700;">
            <i id="upload_speed_title" style="color: black;"> 0.00 B/s </i>
          </i> -->

          <i class="layui-icon layui-icon-download-circle"
            style="font-size: 16px; color: #5FB878; font-weight: 700; margin-left: 15px;">
            <i id="download_speed_title" style="color: black;"> 0.00 B/s </i>
          </i>

        </div>
      </div>
    </div>
  </div>

  <script type="text/html" id="chat_config_actions">
    <div class="chat-action-bar">
      <a class="layui-btn chat-action-btn" lay-event="start">Start</a>
      <a class="layui-btn layui-btn-warm chat-action-btn" lay-event="stop">Stop</a>
      <a class="layui-btn layui-btn-normal chat-action-btn" lay-event="edit">Edit</a>
      <a class="layui-btn layui-btn-danger chat-action-btn" lay-event="delete">Delete</a>
    </div>
  </script>

  <script src="static/layui/layui.js"></script>
  <script>

    layui.use(['table', 'element', 'form'], function () {
      var table = layui.table;
      var element = layui.element;
      var layer = layui.layer;
      var form = layui.form;
      var $ = layui.$;
      var already_download_list_data = new Array()
      var download_list_table_data = new Array()
      var chat_config_table_data = new Array()

      function text_width(value) {
        var text = value == null ? "" : String(value);
        var width = 0;
        for (var i = 0; i < text.length; i++) {
          width += text.charCodeAt(i) > 255 ? 14 : 7;
        }
        return width;
      }

      function auto_column_width(column, data) {
        if (column.contentWidth) {
          return column.contentWidth;
        }
        var maxWidth = text_width(column.title || column.field || "");
        if (column.field) {
          for (var i = 0; i < data.length; i++) {
            maxWidth = Math.max(maxWidth, text_width(data[i][column.field]));
          }
        }
        var width = Math.ceil(maxWidth + (column.padding || 34));
        if (column.minContentWidth) {
          width = Math.max(width, column.minContentWidth);
        }
        if (column.maxContentWidth) {
          width = Math.min(width, column.maxContentWidth);
        }
        return width;
      }

      function fit_columns(columns, data) {
        var source = data || [];
        return columns.map(function (column) {
          var fitted = $.extend({}, column);
          fitted.width = auto_column_width(fitted, source);
          delete fitted.contentWidth;
          delete fitted.minContentWidth;
          delete fitted.maxContentWidth;
          delete fitted.padding;
          return fitted;
        });
      }

      function reload_table_by_content(tableInstance, columns, data) {
        tableInstance.reload({
          data: data,
          cols: [fit_columns(columns, data)]
        });
      }

      function render_chat_action_rows() {
        $('div[lay-id="chat_config_list"] .chat-action-bar').each(function () {
          $(this).closest('.layui-table-cell').addClass('chat-action-cell');
          $(this).closest('tr').addClass('chat-action-row');
        });
      }

      $.ajax({
        url: "get_app_version"
        , type: "get"
        , async: false
        , dataType: "text"
        , success: function (result) {
          $("#app_version").html(result)
        }
      });

      download_state_change = function(e) {
        $.ajax({
        url: "set_download_state?state=" + e.dataset.value
        , type: "post"
        , async: false
        , dataType: "text"
        , success: function (result) {
          $("#download_state").html(result)
          e.dataset.value=result
        }
      });
    }

      var downloadListColumns = [
        { field: 'chat', title: 'chat', minContentWidth: 72 },
        { field: 'id', title: 'id', minContentWidth: 54 },
        { field: 'filename', title: 'file name', align: 'center', minContentWidth: 120, maxContentWidth: 620 },
        { field: 'total_size', title: 'total byte', align: 'center', minContentWidth: 90 },
        {
          field: 'download_progress', title: 'download progress', align: 'center', minContentWidth: 150, templet: function (d) {
            var ys = '';
            if (30 < d.download_progress && d.download_progress < 100) {
              ys = 'layui-bg-blue'
            } else if (0 < d.download_progress && d.download_progress <= 30) {
              ys = 'layui-bg-red'
            }
            else if (100 == d.download_progress) {
              ys = 'layui-bg-green'
            }
            return '<div class="layui-progress layui-progress-big" lay-showpercent="true"  lay-filter="down-' + d.id + '"><div class="layui-progress-bar ' + ys + '" lay-percent="' + d.download_progress + '%"></div></div>'
          }
        },
        { field: 'download_speed', title: 'download speed', align: 'center', minContentWidth: 120 }
      ];

      var alreadyDownloadColumns = [
        { field: 'id', title: 'id', minContentWidth: 54 },
        { field: 'filename', title: 'file name', align: 'center', minContentWidth: 120, maxContentWidth: 620 },
        { field: 'total_size', title: 'total size', align: 'center', minContentWidth: 90 },
        { field: 'save_path', title: 'save path', align: 'center', minContentWidth: 140, maxContentWidth: 760 }
      ];

      var chatConfigColumns = [
        { field: 'chat_id', title: 'chat', minContentWidth: 86 },
        { field: 'status', title: 'status', align: 'center', minContentWidth: 70 },
        { field: 'last_read_message_id', title: 'last id', align: 'center', minContentWidth: 74 },
        { field: 'ids_to_retry', title: 'retry', align: 'center', minContentWidth: 58 },
        { field: 'finish_task', title: 'done', align: 'center', minContentWidth: 58 },
        { field: 'total_task', title: 'total', align: 'center', minContentWidth: 58 },
        {
          field: 'progress', title: 'progress', align: 'center', minContentWidth: 150, templet: function (d) {
            var value = d.progress || 0;
            var color = value == 100 ? 'layui-bg-green' : 'layui-bg-blue';
            return '<div class="layui-progress layui-progress-big" lay-showpercent="true"><div class="layui-progress-bar ' + color + '" lay-percent="' + value + '%"></div></div>'
          }
        },
        { field: 'file_size_min', title: 'min size', align: 'center', minContentWidth: 76 },
        { field: 'file_size_max', title: 'max size', align: 'center', minContentWidth: 76 },
        { field: 'download_filter', title: 'filter', minContentWidth: 80, maxContentWidth: 460 },
        { title: 'action', toolbar: '#chat_config_actions', contentWidth: 240, fixed: 'right', align: 'center' }
      ];

      var downloadListTable = table.render({
        elem: '#download_list'
        , data: download_list_table_data
        , title: 'download_list'
        , height: 'full-160'
        , limit: 10000
        , cols: [fit_columns(downloadListColumns, download_list_table_data)]
        , done: function (res, currentCount) {
          element.render()
        }
      });

      var alreadyDownloadTable = table.render({
        elem: '#already_download_list'
        , data: already_download_list_data
        , title: 'already_download_list'
        , height: 'full-160'
        , limit: 10000
        , cols: [fit_columns(alreadyDownloadColumns, already_download_list_data)]
        , done: function (res, currentCount) {
          element.render()
        }
      });

      var chatConfigTable = table.render({
        elem: '#chat_config_list'
        , data: chat_config_table_data
        , title: 'chat_config_list'
        , height: 'full-230'
        , limit: 10000
        , cols: [fit_columns(chatConfigColumns, chat_config_table_data)]
        , done: function () {
          element.render()
          render_chat_action_rows()
        }
      });

      function reload_chat_configs() {
        $.ajax({
          url: "get_chat_configs"
          , type: "get"
          , async: false
          , dataType: "json"
          , success: function (result) {
            chat_config_table_data = result.data || []
            reload_table_by_content(chatConfigTable, chatConfigColumns, chat_config_table_data)
          }
        });
      };

      function reset_chat_form() {
        $("#origin_chat_id").val("")
        form.val("chat_config_form", {
          "origin_chat_id": "",
          "chat_id": "",
          "last_read_message_id": "",
          "file_size_min": "",
          "file_size_max": "",
          "download_filter": ""
        })
      };

      function post_chat_action(url, data, success) {
        $.ajax({
          url: url
          , type: "post"
          , data: data
          , dataType: "json"
          , success: function (result) {
            if (result.code != 0) {
              layer.msg(result.msg || "failed")
              return
            }
            if (success) {
              success(result)
            }
            reload_chat_configs()
          }
        });
      };

      form.on('submit(save_chat_config)', function (data) {
        post_chat_action("save_chat_config", data.field, function () {
          reset_chat_form()
        })
        return false;
      });

      $("#reset_chat_config").on("click", function () {
        reset_chat_form()
      });

      table.on('tool(chat_config_list)', function (obj) {
        var data = obj.data;
        if (obj.event === 'start') {
          post_chat_action("start_chat_download", { chat_id: data.chat_id })
        } else if (obj.event === 'stop') {
          post_chat_action("stop_chat_download", { chat_id: data.chat_id })
        } else if (obj.event === 'edit') {
          form.val("chat_config_form", {
            "origin_chat_id": data.chat_id,
            "chat_id": data.chat_id,
            "last_read_message_id": data.last_read_message_id,
            "file_size_min": data.file_size_min_bytes || "",
            "file_size_max": data.file_size_max_bytes || "",
            "download_filter": data.download_filter || ""
          })
        } else if (obj.event === 'delete') {
          layer.confirm('Delete ' + data.chat_id + '?', function (index) {
            post_chat_action("delete_chat_config", { chat_id: data.chat_id })
            layer.close(index)
          });
        }
      });

      function update_download_list() {
        $.ajax({
          url: "get_download_list?already_down=false"
          , type: "get"
          , async: false
          , dataType: "json"
          , success: function (result) {
            var active_data = []
            for (var i = 0, len = result.length; i < len; i++) {
              if (result[i].download_progress != 100) {
                active_data.push(result[i])
              }
            }
            download_list_table_data = active_data
            reload_table_by_content(downloadListTable, downloadListColumns, download_list_table_data)
            element.render()
          }
        });

      };


      function update_download_status() {
        $.ajax({
          url: "get_download_status"
          , type: "get"
          , async: false
          , dataType: "json"
          , success: function (result) {
            $("#download_speed_title").html(result.download_speed)
          }
        });

      };


      var update_download_list_int = self.setInterval(update_download_list, 1000);
      var update_download_status_int = self.setInterval(update_download_status, 1000);
      var update_already_download_list_int = 0;
      var update_chat_config_int = 0;


      function update_already_download_list() {
        $.ajax({
          url: "get_download_list?already_down=true"
          , type: "get"
          , async: false
          , dataType: "json"
          , success: function (result) {
            var finished_data = []
            for (var i = 0, len = result.length; i < len; i++) {
              if (result[i].download_progress == 100) {
                finished_data.push(result[i])
              }
            }
            already_download_list_data = finished_data
            reload_table_by_content(alreadyDownloadTable, alreadyDownloadColumns, already_download_list_data)
            element.render()
          }
        });

      };

      element.on('tab(telegram_media_downloader)', function (data) {
        if (data.index != 0) {
          clearInterval(update_download_list_int);
        }

        if (data.index == 0) {
          update_download_list_int = self.setInterval(update_download_list, 1000);
        }

        if (data.index != 1) {
          clearInterval(update_already_download_list_int);
        }

        if (data.index == 1) {
          update_already_download_list_int = self.setInterval(update_already_download_list, 1000);
        }

        if (data.index != 2) {
          clearInterval(update_chat_config_int);
        }

        if (data.index == 2) {
          reload_chat_configs();
          update_chat_config_int = self.setInterval(reload_chat_configs, 2000);
        }

      });

    });
  </script>
</body>

</html>
